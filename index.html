<!doctype html>
<html lang="ko">
<head>
<title>사진 짝 맞추기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151D2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="짝 맞추기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{
    color-scheme: dark;
    --felt:#1F2A3C;
    --felt-deep:#151D2B;
    --bar:#101724;
    --ink:#ECE5D3;
    --ink-dim:#A3AEC2;
    --brass:#D8A445;
    --brass-ink:#2A1D06;
    --line:rgba(236,229,211,.14);
    --chip:rgba(236,229,211,.06);
  }
  html{box-sizing:border-box;height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    background:var(--felt-deep);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  .app{position:relative;height:100%}
  /* 화면이 세로면 게임 화면 전체를 90도 돌려 세로 화면을 꽉 채운다 — 태블릿을 옆으로 돌려 들면 가로 화면처럼 보임 (자동회전 꺼도 됨) */
  @media (orientation:portrait){
    .app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:0 18px;
    border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-size:19px;font-weight:500;line-height:1.2;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .btn:focus-visible,.vh:focus-visible + label{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .btn[aria-pressed="true"]{background:rgba(216,164,69,.16);border-color:var(--brass);color:var(--brass)}
  .btn[data-armed="1"]{background:#7A2E22;border-color:#C25A45;color:#FFE9E2}
  /* 카드 수는 앱 안의 버튼으로 고른다 — 기기 기본 선택 창(select)은 돌린 화면을 따라 돌지 않는다 */
  .seg{display:flex;align-items:center;gap:6px}
  .seg .lbl{color:var(--ink-dim);font-size:17px;padding-right:2px;white-space:nowrap}
  .seg .btn{flex:1 1 0;min-width:0;padding:0 4px;font-size:18px}
  .seg .btn[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .stage{position:absolute;inset:0;background:var(--felt)}
  .gear{
    position:absolute;right:12px;top:12px;min-height:54px;padding:0 22px;font-size:20px;font-weight:700;z-index:2;
    background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)
  }
  /* 카드판 — 크기는 화면에 맞춰 스크립트가 정한다 */
  .board{position:absolute;display:grid;gap:var(--gap)}
  .cardb{
    position:relative;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;perspective:900px;
  }
  .cardb .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
  .cardb.up .in{transform:rotateY(180deg)}
  .cardb .bk,.cardb .fc{
    position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,.35)
  }
  .cardb .bk{
    display:grid;place-items:center;background:var(--brass);border:4px solid #F0C978;
    background-image:repeating-linear-gradient(45deg,rgba(42,29,6,.10) 0 10px,transparent 10px 20px);
    color:var(--brass-ink);font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-size:calc(var(--cs)*.42)
  }
  .cardb .fc{transform:rotateY(180deg);background:var(--ink);border:4px solid var(--ink)}
  .cardb .fc img{width:100%;height:100%;object-fit:cover;display:block}
  .cardb .fc .emo{display:grid;place-items:center;width:100%;height:100%;font-size:calc(var(--cs)*.6);line-height:1}
  .cardb.ok .fc{border-color:var(--brass);box-shadow:0 0 0 4px var(--brass),0 6px 16px rgba(0,0,0,.35)}
  .cardb.no .fc{border-color:#C25A45}
  @media (prefers-reduced-motion:reduce){ .cardb .in{transition:none} }
  .veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,12,20,.55);overflow:auto;z-index:3}
  .card{
    width:min(100%,460px);padding:26px 24px 24px;border-radius:18px;
    background:var(--bar);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:18px
  }
  .card h2{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:1;color:var(--brass)}
  .card h3{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
  .card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:19px;font-variant-numeric:tabular-nums}
  .card dt{color:var(--ink-dim)}
  .card dd{margin:0;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .wide{grid-column:1 / -1}
  .note{margin:0;color:var(--ink-dim);font-size:15px}
  .album{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;border:1px dashed var(--line)}
  .album .note{font-size:16px}
  .album .note b{color:var(--brass)}
  .toast{
    position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:calc(100% - 32px);z-index:4;
    padding:12px 18px;border-radius:12px;background:#3A1E18;border:1px solid #9C4A38;color:#FFE4DB;font-size:17px
  }
  .peekbar{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;
    padding:10px 20px;border-radius:12px;background:rgba(16,23,36,.85);color:var(--ink);font-size:20px;font-weight:700
  }
  @media (prefers-reduced-motion:no-preference){
    .btn{transition:background .15s,border-color .15s,color .15s}
  }
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <div class="board" id="board" role="grid" aria-label="카드판"></div>
    <button id="gear" class="btn gear" type="button">설정</button>
    <div class="peekbar" id="peekbar" hidden>잘 보세요 · <b id="peekN">3</b></div>
    <div class="toast" id="toast" hidden></div>

    <div class="veil" id="menu" hidden>
      <div class="card" role="dialog" aria-label="설정">
        <h3>설정</h3>
        <div class="grid2">
          <input id="dir" class="vh" type="file" webkitdirectory multiple>
          <label for="dir" class="btn primary wide" id="dirLbl">사진 폴더 고르기</label>
          <input id="files" class="vh" type="file" accept="image/*" multiple>
          <label for="files" class="btn wide">사진 여러 장 고르기</label>
          <div class="album wide" id="album" hidden>
            <p class="note">내 사진 <b id="albumN">0</b>장 · 카드에 이 중에서 골라 나와요</p>
            <button id="albumClear" class="btn" type="button">사진 비우기</button>
          </div>
          <div id="count" class="seg wide" role="group" aria-label="카드 수">
            <span class="lbl">카드</span>
            <button class="btn" type="button" data-v="6" aria-pressed="false">6</button>
            <button class="btn" type="button" data-v="8" aria-pressed="true">8</button>
            <button class="btn" type="button" data-v="12" aria-pressed="false">12</button>
            <button class="btn" type="button" data-v="16" aria-pressed="false">16</button>
          </div>
          <button id="peek" class="btn" type="button" aria-pressed="true">처음에 보여 주기</button>
          <button id="sound" class="btn" type="button" aria-pressed="true">소리</button>
          <button id="again" class="btn" type="button">새로 섞기</button>
          <button id="full" class="btn" type="button">전체 화면</button>
        </div>
        <p class="note" id="stat">시간 <b id="tm">0:00</b> · 맞춘 짝 <b id="pc">0/0</b> · 같은 사진 두 장을 찾아 눌러요</p>
        <button id="menuClose" class="btn primary" type="button">닫고 하기</button>
      </div>
    </div>

    <div class="veil" id="done" hidden>
      <div class="card">
        <h2>다 맞췄어요!</h2>
        <dl>
          <dt>걸린 시간</dt><dd id="dTm">0:00</dd>
          <dt>뒤집은 횟수</dt><dd id="dTr">0번</dd>
        </dl>
        <button id="doneAgain" class="btn primary" type="button">한 번 더 하기</button>
        <button id="doneClose" class="btn" type="button">그림 보기</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), board = $('#board');
  const PREFS = 'pairs.prefs', ALBUM = 'pairs.album';
  const DONE_DELAY = 1, AUTO_SEC = 10, MISS_MS = 1300;
  // 내 사진이 모자랄 때 쓰는 기본 그림
  const EMOJI = ['🍎','🍊','🍇','🍓','🌻','🌷','🐟','🐱','🐶','🐔','🏠','🚗','🌙','⭐','🎈','☂️','🍉','🐢','🦋','🌈'];
  const BG = ['#F6E7C8','#DDEFD9','#DCE8F5','#F5DCDC','#EDE0F5','#F8F1C9'];

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
  };
  const shuffle = a => { for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  let prefs = { count: 8, peek: true, sound: true };
  try { Object.assign(prefs, JSON.parse(store.get(PREFS) || '{}')); } catch(e){}
  const savePrefs = () => store.set(PREFS, JSON.stringify(prefs));

  let G = null, showDone = true, urls = [];

  // ---------- 판 배치: 화면에 가장 크게 들어가는 줄·칸 ----------
  function layout(){
    if (!G) return;
    const W = stage.clientWidth, H = stage.clientHeight, n = G.cards.length;
    const gap = Math.round(Math.max(8, Math.min(W, H)*.02)), pad = 14;
    let best = null;
    for (let cols = 1; cols <= n; cols++){
      const rows = Math.ceil(n/cols);
      const cs = Math.min((W - 2*pad - gap*(cols-1))/cols, (H - 2*pad - gap*(rows-1))/rows);
      if (!best || cs > best.cs) best = { cols, rows, cs };
    }
    const cs = Math.floor(best.cs), bw = best.cols*cs + gap*(best.cols-1), bh = best.rows*cs + gap*(best.rows-1);
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--cs', cs + 'px');
    board.style.gridTemplateColumns = `repeat(${best.cols}, ${cs}px)`;
    board.style.gridAutoRows = cs + 'px';
    board.style.left = Math.round((W - bw)/2) + 'px';
    board.style.top = Math.round((H - bh)/2) + 'px';
  }

  // ---------- 게임 ----------
  async function newGame(){
    stopAuto(); clearTimeout(peekT); clearInterval(peekI);
    const n = prefs.count, pairs = n/2;
    const pics = await pickPictures(pairs);
    urls.forEach(u => URL.revokeObjectURL(u)); urls = pics.filter(p => p.url).map(p => p.url);
    const cards = shuffle(pics.flatMap((p, i) => [{ id: i, p }, { id: i, p }]));
    G = { cards, open: [], busy: false, matched: 0, tries: 0, elapsed: 0, started: false, done: false };
    board.textContent = '';
    cards.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'cardb'; b.type = 'button'; b.dataset.i = i;
      b.setAttribute('aria-label', '카드 ' + (i+1));
      const face = c.p.url ? `<img src="${c.p.url}" alt="" draggable="false">` : `<span class="emo" style="background:${c.p.bg}">${c.p.emo}</span>`;
      b.innerHTML = `<span class="in"><span class="bk">?</span><span class="fc">${face}</span></span>`;
      c.el = b;
      board.appendChild(b);
    });
    layout();
    showDone = true; $('#done').hidden = true; $('#menu').hidden = true;
    syncStats();
    if (prefs.peek) peekAll();
  }
  // 처음 몇 초 동안 모든 카드를 보여 준다
  let peekT = 0, peekI = 0;
  function peekAll(){
    const sec = Math.max(3, Math.round(G.cards.length*.4));
    G.busy = true;
    for (const c of G.cards) c.el.classList.add('up');
    let left = sec; $('#peekN').textContent = left; $('#peekbar').hidden = false;
    peekI = setInterval(() => { left--; $('#peekN').textContent = Math.max(1, left); }, 1000);
    const cur = G;
    peekT = setTimeout(() => {
      clearInterval(peekI); $('#peekbar').hidden = true;
      if (G !== cur) return;
      for (const c of G.cards) c.el.classList.remove('up');
      G.busy = false;
    }, sec*1000);
  }

  board.addEventListener('click', e => {
    const b = e.target.closest('.cardb');
    if (!b || !G || G.done) return;
    wakeAudio(); wake();
    if (G.busy) return;
    const c = G.cards[+b.dataset.i];
    if (c.ok || G.open.includes(c)) return;
    G.started = true;
    c.el.classList.add('up');
    G.open.push(c);
    beep(520, .05);
    if (G.open.length < 2) return;
    G.tries++;
    const [a, d] = G.open;
    if (a.id === d.id){
      a.ok = d.ok = true; G.open = [];
      setTimeout(() => { a.el.classList.add('ok'); d.el.classList.add('ok'); beep(784, .13); }, 300);
      G.matched++;
      syncStats();
      if (G.matched === G.cards.length/2) finish();
    } else {
      G.busy = true;
      setTimeout(() => { a.el.classList.add('no'); d.el.classList.add('no'); }, 300);
      const cur = G;
      setTimeout(() => {
        if (G !== cur) return;
        for (const x of [a, d]) x.el.classList.remove('up', 'no');
        G.open = []; G.busy = false;
      }, MISS_MS);
    }
  });

  function finish(){
    G.done = true; G.started = false; showDone = false;
    setTimeout(() => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i*110)), 350);
    const cur = G;
    setTimeout(() => { if (G === cur) openDone(); }, DONE_DELAY*1000 + 350);
  }
  function openDone(){
    if (!G || !G.done || showDone) return;
    showDone = true;
    $('#dTm').textContent = fmt(G.elapsed);
    $('#dTr').textContent = G.tries + '번';
    $('#done').hidden = false;
    startAuto();
  }
  // 다 맞춘 뒤 「그림 보기」로 카드를 보다가 아무 데나 누르면 완성 창이 다시 뜬다
  stage.addEventListener('click', e => {
    if (G && G.done && !showDone && !e.target.closest('.gear, .veil')) openDone();
  });

  // 완성 창에서 가만히 있으면 10초 뒤 새 판
  let autoT = 0, autoN = 0;
  function stopAuto(){ clearInterval(autoT); autoT = 0; $('#doneAgain').textContent = '한 번 더 하기'; }
  function startAuto(){
    stopAuto(); autoN = AUTO_SEC;
    const b = $('#doneAgain'), show = () => { b.textContent = `한 번 더 하기 (${autoN})`; };
    show();
    autoT = setInterval(() => { if (document.hidden) return; if (--autoN <= 0) newGame(); else show(); }, 1000);
  }

  // ---------- 내 사진 (줄여서 기기 안에 저장) ----------
  let album = [], dbp = null, importJob = 0;
  function db(){
    if (!dbp) dbp = new Promise((ok, no) => {
      try {
        const rq = indexedDB.open('pairs', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('photos');
        rq.onsuccess = () => ok(rq.result);
        rq.onerror = () => no(rq.error);
      } catch(e){ no(e); }
    });
    return dbp;
  }
  function idb(mode, fn){
    return db().then(d => new Promise((ok, no) => {
      const tx = d.transaction('photos', mode), r = fn(tx.objectStore('photos'));
      tx.oncomplete = () => ok(r && r.result);
      tx.onerror = tx.onabort = () => no(tx.error);
    }));
  }
  // 카드에 맞게 가운데를 네모로 잘라 줄인다
  function squareBlob(file){
    return new Promise((ok, no) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        URL.revokeObjectURL(url);
        const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(w, h), out = Math.min(600, s);
        const c = document.createElement('canvas'); c.width = c.height = out;
        c.getContext('2d').drawImage(im, (w - s)/2, (h - s)*.4, s, s, 0, 0, out, out);
        c.toBlob(b => b ? ok(b) : no(new Error('blob')), 'image/jpeg', .85);
      };
      im.onerror = () => { URL.revokeObjectURL(url); no(new Error('decode')); };
      im.src = url;
    });
  }
  function loadAlbum(){
    try { const a = JSON.parse(store.get(ALBUM) || 'null'); if (a && Array.isArray(a.keys)) album = a.keys; } catch(e){}
    syncAlbum();
  }
  const saveAlbum = () => store.set(ALBUM, JSON.stringify({ keys: album }));
  function syncAlbum(){ $('#album').hidden = !album.length; $('#albumN').textContent = album.length; }

  async function useFiles(list){
    const files = [...list].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name));
    if (!files.length){ toast('사진 파일이 없어요. 사진을 골라 주세요.'); return; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    const job = ++importJob;
    try { await idb('readwrite', st => st.clear()); } catch(e){ toast('이 기기에서는 사진을 저장할 수 없어요.'); return; }
    album = []; let key = 0, begun = false;
    $('#menu').hidden = true;
    toast('사진 준비 중…');
    for (const f of shuffle(files)){
      try {
        const blob = await squareBlob(f);
        if (job !== importJob) return;
        const k = key++;
        await idb('readwrite', st => st.put(blob, k));
        album.push(k);
      } catch(e){ if (job !== importJob) return; }
      // 첫 판에 필요한 만큼 모이면 바로 시작하고 나머지는 계속 정리
      if (!begun && album.length === prefs.count/2){ begun = true; saveAlbum(); syncAlbum(); newGame(); }
      if (album.length % 10 === 0 && files.length > 10) toast(`사진 정리 중… ${album.length}/${files.length}`);
    }
    saveAlbum(); syncAlbum();
    if (!begun) newGame();
    toast(`사진 ${album.length}장을 넣었어요.` + (album.length < prefs.count/2 ? ' 사진이 모자란 카드는 기본 그림이 나와요.' : ''));
  }
  // 판에 쓸 그림: 내 사진에서 겹치지 않게, 모자라면 기본 그림
  async function pickPictures(n){
    const out = [];
    for (const k of shuffle(album.slice())){
      if (out.length >= n) break;
      try { const b = await idb('readonly', st => st.get(k)); if (b) out.push({ url: URL.createObjectURL(b) }); } catch(e){}
    }
    const emos = shuffle(EMOJI.slice());
    while (out.length < n){ const i = out.length; out.push({ emo: emos[i % emos.length], bg: BG[i % BG.length] }); }
    return out;
  }

  // ---------- 소리·화면 ----------
  let ac = null;
  function wakeAudio(){
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){}
  }
  function beep(freq, dur){
    if (!prefs.sound || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.22, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch(e){}
  }
  let wl = null;
  async function wake(){
    try { if (!wl && navigator.wakeLock){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch(e){}
  }

  // ---------- UI ----------
  const fmt = ms => { const t = Math.floor(ms/1000); return `${Math.floor(t/60)}:${String(t % 60).padStart(2, '0')}`; };
  function syncStats(){
    if (!G) return;
    $('#tm').textContent = fmt(G.elapsed);
    $('#pc').textContent = `${G.matched}/${G.cards.length/2}`;
  }
  let toastT = 0;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200);
  }
  const toggle = (btn, on) => btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  function syncSeg(){ for (const b of $('#count').querySelectorAll('[data-v]')) toggle(b, +b.dataset.v === prefs.count); }

  $('#dir').addEventListener('change', e => { const fs = e.target.files ? [...e.target.files] : []; e.target.value = ''; if (fs.length) useFiles(fs); });
  $('#files').addEventListener('change', e => { const fs = e.target.files ? [...e.target.files] : []; e.target.value = ''; if (fs.length) useFiles(fs); });
  // 아이폰·아이패드는 폴더 고르기가 안 된다
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!('webkitdirectory' in $('#dir')) || iOS){ $('#dir').hidden = true; $('#dirLbl').hidden = true; }
  const clr = $('#albumClear');
  let clrT = 0;
  clr.addEventListener('click', () => {
    if (clr.dataset.armed !== '1'){
      clr.dataset.armed = '1'; clr.textContent = '한 번 더 누르면 비워요';
      clearTimeout(clrT); clrT = setTimeout(() => { clr.dataset.armed = '0'; clr.textContent = '사진 비우기'; }, 2600);
      return;
    }
    clearTimeout(clrT); clr.dataset.armed = '0'; clr.textContent = '사진 비우기';
    importJob++; album = []; saveAlbum(); syncAlbum();
    idb('readwrite', st => st.clear()).catch(() => {});
    newGame();
  });
  $('#count').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || +b.dataset.v === prefs.count) return;
    prefs.count = +b.dataset.v; savePrefs(); syncSeg(); newGame();
  });
  $('#peek').addEventListener('click', e => { prefs.peek = !prefs.peek; savePrefs(); toggle(e.currentTarget, prefs.peek); });
  $('#sound').addEventListener('click', e => { prefs.sound = !prefs.sound; savePrefs(); toggle(e.currentTarget, prefs.sound); if (prefs.sound){ wakeAudio(); beep(660, .08); } });
  $('#again').addEventListener('click', newGame);
  $('#doneAgain').addEventListener('click', newGame);
  $('#doneClose').addEventListener('click', e => { e.stopPropagation(); stopAuto(); showDone = false; $('#done').hidden = true; });
  $('#gear').addEventListener('click', () => { stopAuto(); syncStats(); $('#menu').hidden = false; });
  $('#menuClose').addEventListener('click', e => { e.stopPropagation(); $('#menu').hidden = true; });
  const fullBtn = $('#full'), fsEl = document.documentElement;
  if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener('click', () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => toast('이 기기에서는 전체 화면을 쓸 수 없어요.')); }
    } catch(e){ toast('이 기기에서는 전체 화면을 쓸 수 없어요.'); }
    $('#menu').hidden = true;
  });

  // 시계: 첫 카드를 누른 뒤부터, 화면이 보일 때만
  let last = performance.now();
  setInterval(() => {
    const now = performance.now();
    if (G && G.started && !G.done && !document.hidden){ G.elapsed += now - last; syncStats(); }
    last = now;
  }, 500);
  document.addEventListener('visibilitychange', () => { last = performance.now(); if (!document.hidden && G && G.started) wake(); });
  new ResizeObserver(layout).observe(stage);

  toggle($('#peek'), prefs.peek); toggle($('#sound'), prefs.sound); syncSeg();
  loadAlbum();
  newGame();
})();
</script>

<script>
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches){ const b = document.getElementById('full'); if (b) b.hidden = true; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
